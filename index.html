<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetAcoustics - Data Collector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* حركة الوميض لزر التسجيل */
        @keyframes pulse-red {
            0%, 100% { background-color: #ef4444; }
            50% { background-color: #991b1b; }
        }
        .recording {
            animation: pulse-red 1.5s infinite;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans p-6">

    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden mt-10">
        <!-- Header -->
        <div class="bg-teal-600 p-6 text-white text-center">
            <h1 class="text-3xl font-bold">🎙️ VetAcoustics</h1>
            <p class="text-teal-100 mt-2">Clinical Audio Data Collector</p>
        </div>

        <!-- Form -->
        <div class="p-8 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Species -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Species</label>
                    <select id="species" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-teal-500 focus:border-teal-500">
                        <option value="Dog">Dog 🐕</option>
                        <option value="Cat">Cat 🐈</option>
                        <option value="Horse">Horse 🐎</option>
                        <option value="Cattle">Cattle 🐄</option>
                    </select>
                </div>

                <!-- Zone -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Auscultation Zone</label>
                    <select id="zone" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-teal-500 focus:border-teal-500">
                        <option value="LeftCranial">Left Cranial Lung Lobe</option>
                        <option value="LeftCaudal">Left Caudal Lung Lobe</option>
                        <option value="RightCranial">Right Cranial Lung Lobe</option>
                        <option value="RightCaudal">Right Caudal Lung Lobe</option>
                        <option value="Trachea">Trachea</option>
                    </select>
                </div>

                <!-- Finding -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Sound / Finding</label>
                    <select id="finding" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-teal-500 focus:border-teal-500">
                        <option value="Normal">Normal (Vesicular)</option>
                        <option value="Wheezes">Wheezes</option>
                        <option value="Crackles">Crackles / Rales</option>
                        <option value="Stridor">Stridor</option>
                        <option value="Purring">Artifact - Purring</option>
                        <option value="Panting">Artifact - Panting</option>
                        <option value="Rub">Artifact - Hair Rub</option>
                    </select>
                </div>

                <!-- Case ID -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Case ID / Diagnosis</label>
                    <input type="text" id="caseId" placeholder="e.g., FelineAsthma_01" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-teal-500 focus:border-teal-500">
                </div>
            </div>

            <!-- Buttons -->
            <div class="flex flex-col space-y-4 pt-6 mt-6 border-t border-gray-200">
                <button id="startBtn" class="w-full bg-gray-800 text-white font-bold py-4 rounded-xl text-lg transition hover:bg-gray-700 shadow-md">
                    🔴 Start Recording
                </button>
                <button id="stopBtn" class="w-full bg-teal-600 text-white font-bold py-4 rounded-xl text-lg transition hover:bg-teal-500 shadow-md hidden">
                    ⏹️ Stop & Save Audio
                </button>
            </div>
            
            <p id="status" class="text-center text-sm text-gray-500 font-medium mt-4">Ready to record.</p>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let mediaRecorder;
        let audioChunks = [];
        
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusText = document.getElementById('status');

        startBtn.addEventListener('click', async () => {
            try {
                // طلب صلاحية المايكروفون
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    // تجهيز الملف الصوتي
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    
                    // جلب البيانات من الفورم لتسمية الملف
                    const species = document.getElementById('species').value;
                    const zone = document.getElementById('zone').value;
                    const finding = document.getElementById('finding').value;
                    const caseId = document.getElementById('caseId').value.replace(/\s+/g, '_') || 'UnknownCase';
                    
                    const fileName = `${species}_${zone}_${finding}_${caseId}.webm`;

                    // تحميل الملف تلقائياً
                    const downloadLink = document.createElement('a');
                    downloadLink.href = audioUrl;
                    downloadLink.download = fileName;
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    document.body.removeChild(downloadLink);
                    
                    statusText.innerText = `Saved: ${fileName}`;
                };

                // بدء التسجيل وتغيير شكل الأزرار
                mediaRecorder.start();
                startBtn.classList.add('recording');
                startBtn.innerText = "Recording... (Listening)";
                stopBtn.classList.remove('hidden');
                statusText.innerText = "Recording in progress... Make sure stethoscope is placed correctly.";

            } catch (err) {
                console.error("Error accessing microphone:", err);
                statusText.innerText = "Error: Please allow microphone access!";
                statusText.classList.add('text-red-500');
            }
        });

        stopBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                // إيقاف استخدام المايك تماماً
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                
                // إرجاع الأزرار لشكلها الطبيعي
                startBtn.classList.remove('recording');
                startBtn.innerText = "🔴 Start Recording";
                stopBtn.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
